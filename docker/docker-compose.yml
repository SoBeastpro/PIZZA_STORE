services:

  backend:
    build:
      context: ../backend

    container_name: pizza_backend

    ports:
      - "5000:5000"

    env_file:
      - ../backend/.env

    depends_on:
      - postgres

    volumes:
      - ../backend:/app


  postgres:
    image: postgres:16

    container_name: pizza_postgres

    environment:
      POSTGRES_DB: pizza_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: