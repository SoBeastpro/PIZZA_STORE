services:
  nginx:
    image: nginx:latest
    container_name: sich_site
    ports:
      - "80:80"
      - "127.0.0.1:8443:443"
    volumes:
      - /var/www/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /var/www/sich_site:/usr/share/nginx/html
      - /docker/ssl/certs:/etc/letsencrypt/:ro
    restart: unless-stopped

