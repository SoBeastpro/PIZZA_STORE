<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Оплата успешна</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
        }
        h1 { font-size: 3rem; margin-bottom: 1rem; }
        p { font-size: 1.2rem; margin-bottom: 2rem; }
        .btn {
            background: white;
            color: #667eea;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ Оплата успешна!</h1>
        <p>Ваш заказ принят и готовится.<br>Статус заказа можно отслеживать на сайте.</p>
        <a href="/" class="btn">Вернуться на сайт</a>
    </div>
    <script>setTimeout(() => window.close(), 3000);</script>
</body>
</html>
